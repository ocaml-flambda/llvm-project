name: OxCaml LLDB CI

# Builds clang + lldb (including the OxCaml plugin) and runs LLDB's unit and
# shell test suites. On pull requests it then builds the oxcaml compiler and
# runs its DWARF test suite against the freshly built lldb. Triggered on the
# active OxCaml development branch only.

on:
  push:
    branches: [oxcaml-llvm-plugin]
  pull_request:
    branches: [oxcaml-llvm-plugin]

# Cancel superseded runs on the same branch/PR to save runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build LLDB + unit/shell + DWARF tests (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "2G"
      CCACHE_COMPRESS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld ccache python3 python3-dev swig
          # python3 drives the lit test runner (llvm-lit). swig + python3-dev
          # are required to build LLDB's embedded script interpreter, which the
          # OxCaml DWARF tests use to drive lldb (LLDB_ENABLE_PYTHON=ON below).

      # Use the split restore/save form instead of actions/cache@v4. The
      # combined action only saves in a post-step at the very end of the job,
      # which is SKIPPED when the job is cancelled (e.g. by timeout-minutes or
      # cancel-in-progress). With an explicit save step right after the build
      # (below) we persist the warm ccache before the tests can hang or fail.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # Per-commit key so each run saves a fresh cache; restore-keys fall
          # back to the most recent cache for this branch, then any branch.
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Configure (CMake + Ninja)
        run: |
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_PROJECTS="clang;lld;lldb" \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_CCACHE_BUILD=ON \
            -DLLDB_ENABLE_PYTHON=ON \
            -DLLDB_INCLUDE_TESTS=ON
          # No LTO: -DLLVM_ENABLE_LTO is intentionally left unset

      - name: Build lldb
        run: |
          ccache --zero-stats
          ninja -C build lldb lldb-server

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}

      # - name: Unit tests (check-lldb-unit)
      #   timeout-minutes: 45
      #   run: ninja -C build check-lldb-unit

      # - name: Shell tests (check-lldb-shell)
      #   timeout-minutes: 60
      #   run: ninja -C build check-lldb-shell

      # --- OxCaml DWARF tests ----------------------------------------------
      # Build the oxcaml compiler and run its DWARF test suite against the lldb
      # built above. Limited to the PRs (so skipped when pushing to
      # oxcaml-llvm-plugin).
      - name: Install oxcaml build dependencies
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get install -y --no-install-recommends \
            gdb autoconf build-essential

      - name: Resolve oxcaml source ref
        id: oxcaml_ref
        if: github.event_name == 'pull_request'
        # Default to oxcaml/oxcaml main; override with a companion PR when this
        # PR's body links one as
        # [Companion OxCaml PR](https://github.com/oxcaml/oxcaml/pull/N).
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          num=$(printf '%s' "$PR_BODY" \
            | grep -oE '\[Companion OxCaml PR\]\(https://github\.com/oxcaml/oxcaml/pull/[0-9]+\)' \
            | grep -oE 'pull/[0-9]+' | grep -oE '[0-9]+' | head -1)
          if [ -n "$num" ]; then
            echo "ref=refs/pull/$num/head" >> "$GITHUB_OUTPUT"
            echo "Testing against companion oxcaml PR #$num"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Testing against oxcaml/oxcaml main"
          fi

      - name: Checkout oxcaml
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: oxcaml/oxcaml
          # refs/pull/N/head on the base repo also covers PRs from forks.
          ref: ${{ steps.oxcaml_ref.outputs.ref }}
          path: oxcaml-src

      - name: Set up OCaml toolchain
        if: github.event_name == 'pull_request'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
          # setup-ocaml already caches the opam root (the switch + installed
          # packages such as dune/menhir). dune-cache additionally persists
          # ~/.cache/dune across runs so `make compiler` reuses build artifacts
          # for the (largely unchanged) oxcaml source tree.
          dune-cache: true

      - name: Install oxcaml build tools
        if: github.event_name == 'pull_request'
        run: opam install -y dune menhir.20231231

      - name: Build oxcaml compiler
        if: github.event_name == 'pull_request'
        working-directory: oxcaml-src
        env:
          # Build the OCaml runtime with gcc, overriding the job-level
          # CC=clang/CXX=clang++ used for the LLVM build.
          CC: gcc
          CXX: g++
        run: |
          # Bring the opam switch onto PATH for the whole block: ./configure
          # probes for ocamlopt directly, so it must run under the opam env
          # (setup-ocaml does not add the switch bin to PATH for plain steps).
          eval "$(opam env)"
          autoconf
          ./configure --prefix="$PWD/_install" --enable-function-sections
          make compiler

      - name: Run DWARF tests
        if: github.event_name == 'pull_request'
        working-directory: oxcaml-src
        env:
          OXCAML_LLDB: ${{ github.workspace }}/build/bin/lldb
          # Disable the dune cache for this step (it is enabled globally by
          # setup-ocaml's dune-cache for the compiler build), because the tests
          # invoke $OXCAML_LLDB, a binary outside the dune workspace referenced
          # only by a constant path in an env var.
          DUNE_CACHE: disabled
        run: opam exec -- make runtest-dwarf

      - name: ccache statistics
        if: always()
        run: ccache --show-stats
